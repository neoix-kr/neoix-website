<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>믿음의 항해 — 관리자 창</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  /* ── 관리자 창 — 양피지 배경 + 검은 글씨. 읽기가 최우선 ── */
  :root{
    --paper:#F7F0DC;        /* 양피지 바탕 */
    --paper-lt:#FDFAF0;     /* 카드(더 밝게) */
    --paper-dk:#EDE3C8;     /* 표 머리·구분 */
    --edge:#D9CCA8;         /* 테두리 */
    --ink:#14100A;          /* 본문 — 거의 검정 */
    --ink-2:#3E362A;        /* 보조 */
    --ink-3:#6E6350;        /* 흐린 글씨 */
    --brass:#B8891A; --brass-dk:#7A5A0C;
    --red:#9E3B2C; --green:#2F6B4F;
    --r:9px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Apple SD Gothic Neo','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    color:var(--ink); min-height:100vh; padding:22px; font-size:15.5px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(130% 90% at 50% 0%, rgba(255,253,246,.85), transparent 60%),
      linear-gradient(180deg,#F4EBD3,#EFE5CA);
  }
  .wrap{max-width:1240px;margin:0 auto}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;
    padding-bottom:15px;border-bottom:2px solid var(--edge)}
  h1{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .sub{font-size:13.5px;color:var(--ink-3)}
  .grow{flex:1}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
    background:var(--paper-lt);border:1px solid var(--edge);border-radius:99px;padding:6px 13px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.8s infinite}
  @keyframes blink{50%{opacity:.3}}

  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;
    background:var(--paper-lt);border:1px solid var(--edge);border-radius:var(--r);padding:4px}
  .tabs button{font:inherit;font-size:14.5px;font-weight:600;color:var(--ink-2);background:transparent;
    border:0;border-radius:6px;padding:10px 18px;cursor:pointer;transition:.12s}
  .tabs button:hover{background:var(--paper-dk);color:var(--ink)}
  .tabs button.on{background:var(--ink);color:var(--paper-lt)}

  .card{background:var(--paper-lt);border:1px solid var(--edge);border-radius:var(--r);
    padding:18px 20px;margin-bottom:13px;box-shadow:0 1px 3px rgba(60,45,15,.06)}
  .k{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);margin-bottom:12px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
  .stat{background:var(--paper);border:1px solid var(--edge);border-radius:7px;padding:12px;text-align:center}
  .stat span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .stat b{display:block;margin-top:3px;font-size:25px;font-weight:800;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat b i{font-style:normal;font-size:13px;font-weight:600;color:var(--ink-3)}

  .bar{height:7px;border-radius:99px;background:var(--paper-dk);margin-top:12px;overflow:hidden;
    border:1px solid var(--edge)}
  .bar i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .3s}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{border-bottom:1px solid var(--edge);padding:11px 10px;text-align:left;vertical-align:top;color:var(--ink)}
  thead th,tr:first-child th{background:var(--paper-dk);font-size:13px;font-weight:800;color:var(--ink-2);
    border-bottom:1.5px solid var(--edge)}
  tr:last-child td{border-bottom:0}
  td b{font-weight:800;color:var(--ink)}

  .pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;
    border:1px solid var(--edge);color:var(--ink-2);background:var(--paper-lt)}
  .pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper-lt)}
  .pill.ok{background:#E4F0E8;border-color:#A8C9B6;color:var(--green);font-weight:700}

  details{border:1px solid var(--edge);border-radius:8px;margin-bottom:8px;background:var(--paper-lt);overflow:hidden}
  summary{padding:14px 16px;cursor:pointer;font-size:15.5px;font-weight:600;list-style:none;
    display:flex;align-items:center;gap:8px;color:var(--ink)}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▸';color:var(--ink-3);font-size:12px}
  details[open] summary{border-bottom:1px solid var(--edge);background:var(--paper)}
  details[open] summary::before{content:'▾'}
  details .body{padding:15px 16px 18px}
  .g{margin-top:14px;font-size:15px;line-height:1.8;color:var(--ink)}
  .g:first-child{margin-top:0}
  .g em{display:block;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.05em;
    color:var(--ink-3);margin-bottom:4px}
  .g.word{border-top:1px solid var(--edge);padding-top:12px;color:var(--ink-2)}

  .note{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
  .warn{background:#FBEDE8;border:1px solid #D9AFA2;border-radius:8px;
    padding:14px 16px;font-size:14.5px;line-height:1.75;color:#5C2418;margin-top:12px}
  .warn b{color:var(--red);font-weight:800}

  a.btn,button.btn{display:inline-block;font:inherit;font-size:14.5px;font-weight:700;text-decoration:none;
    color:var(--paper-lt);background:var(--ink);border:0;border-radius:8px;padding:11px 19px;
    margin-right:8px;margin-top:8px;cursor:pointer;transition:.12s}
  a.btn:hover,button.btn:hover{background:#2A2318}
  a.btn.ghost,button.btn.ghost{background:var(--paper-lt);color:var(--ink);border:1px solid var(--edge)}
  a.btn.ghost:hover{background:var(--paper-dk)}

  .gate{max-width:370px;margin:15vh auto;text-align:center;background:var(--paper-lt);
    border:1px solid var(--edge);border-radius:12px;padding:38px 30px;
    box-shadow:0 6px 20px rgba(60,45,15,.12)}
  .gate h1{font-size:20px}
  .gate input{width:100%;font:inherit;font-size:26px;font-weight:700;letter-spacing:10px;text-align:center;
    background:var(--paper);border:1.5px solid var(--edge);border-radius:8px;padding:14px;
    color:var(--ink);margin-top:18px}
  .gate input:focus{outline:none;border-color:var(--ink);background:#fff}
  .err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:20px;font-weight:600}

  /* 안내서 */
  .manual{font-size:16.5px;line-height:1.9;color:var(--ink);max-width:820px}
  .manual h1{font-size:28px;font-weight:800;margin:4px 0 16px;letter-spacing:-.02em}
  .manual h2{font-size:21px;font-weight:800;margin:34px 0 12px;padding-bottom:9px;
    border-bottom:2px solid var(--ink);letter-spacing:-.01em}
  .manual h3{font-size:18px;font-weight:700;margin:24px 0 9px}
  .manual h4{font-size:16px;font-weight:700;margin:18px 0 7px;color:var(--ink-2)}
  .manual p{margin:11px 0}
  .manual ul{margin:11px 0 11px 20px}
  .manual li{margin:7px 0}
  .manual b{font-weight:800;color:var(--ink)}
  .manual table{margin:16px 0;font-size:15px;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
  .manual th,.manual td{padding:12px}
  .manual blockquote{margin:16px 0;padding:14px 18px;border-left:4px solid var(--brass);
    background:var(--paper);border-radius:0 8px 8px 0;color:var(--ink)}
  .manual pre{background:#1E1913;color:#EDE3C8;border-radius:8px;padding:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.65;overflow-x:auto}
  .manual code{background:var(--paper-dk);border-radius:5px;padding:2px 7px;font-size:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red)}
  .manual pre code{background:none;color:inherit;padding:0}
  .manual hr{border:0;border-top:1px solid var(--edge);margin:28px 0}
  .manual a{color:var(--brass-dk);font-weight:600;text-decoration:underline;text-underline-offset:3px}

  /* ── 인쇄: 지금 보고 있는 탭이 A4에 그대로 나오게 ── */
  @page{ size:A4 portrait; margin:14mm 13mm }
  .print-only{display:none}
  @media print{
    html,body{background:#fff !important;color:#000;padding:0;margin:0;font-size:11pt}
    body::before,body::after{display:none !important}
    .tabs,.live,.grow,#gate,a.btn,button.btn,.noprint{display:none !important}
    .wrap{max-width:none;margin:0}
    header{border-bottom:1.5px solid #000;padding-bottom:6mm;margin-bottom:6mm}
    header h1{font-size:16pt}
    .print-only{display:block}
    .print-title{font-size:13pt;font-weight:800;margin-bottom:4mm}
    .card{background:#fff !important;border:1px solid #999;box-shadow:none;
      padding:5mm 6mm;margin-bottom:5mm;break-inside:avoid;page-break-inside:avoid}
    .k{color:#000;font-size:10pt}
    table{font-size:10pt;width:100%}
    th,td{border-bottom:1px solid #bbb;padding:2.4mm 2.6mm;color:#000}
    thead th,tr:first-child th{background:#EEE9DA !important;color:#000}
    tr{break-inside:avoid;page-break-inside:avoid}
    /* 접힌 토글도 인쇄에는 전부 펼쳐서 나온다 */
    details{border:1px solid #999;background:#fff !important;break-inside:avoid;page-break-inside:avoid}
    details > .body,details .body{display:block !important}
    summary{font-weight:800;background:#F2EDE0 !important}
    summary::before{content:'' !important}
    .warn{background:#fff !important;border:1.2px solid #000;color:#000}
    .warn b{color:#000}
    .pill{border:1px solid #666;color:#000;background:#fff !important}
    .pill.on,.pill.ok{background:#E8E8E8 !important;color:#000}
    .manual{max-width:none;font-size:11pt}
    .manual h2{page-break-after:avoid;break-after:avoid}
    .manual pre{background:#F2F0EA !important;color:#000;border:1px solid #bbb}
    .manual code{background:#EFEBDE !important;color:#000}
    .bar,.bar i{border:1px solid #666}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>관리자 창</h1>
  <p class="sub" style="margin-top:8px">믿음의 항해 · 인솔 교사용</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="····" autocomplete="off">
  <div class="err" id="err"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>관리자 창</h1>
    <span class="sub">믿음의 항해 · 인솔 교사용</span>
    <span class="grow"></span>
    <span class="live"><i></i><span id="liveTxt">이 기기의 게임 상태를 2초마다 읽는 중</span></span>
    <button class="btn ghost" onclick="window.print()" title="지금 보고 있는 탭을 A4로 인쇄">🖨 이 화면 인쇄 (A4)</button>
  </header>
  <div class="print-only print-title" id="printTitle"></div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script src="teach.js"></script>
<script>
const PIN='3574', LS_KEY='faithVoyage_v3';
const SB_URL='https://nroddjekdjwnwguwkudl.supabase.co';
const SB_KEY='sb_publishable_Uygr7NmVn1wmqopNrb4FRw_CRWw7Xeg';
let ROWS=[], SYNCED=null, SYNCERR='';
function fetchTeams(){
  return fetch(SB_URL+'/rest/v1/escape_progress?select=*&order=solved.desc,elapsed_ms.asc',
    {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{ ROWS=j; SYNCED=new Date(); SYNCERR=''; })
    .catch(e=>{ SYNCERR='서버 연결 실패 ('+e+')'; });
}

/* 자물쇠 — index.html의 phys 코드와 반드시 일치해야 한다 */
const LOCKS=[
  {name:'승선 명부함', room:'갑판',   code:'2031', verse:'요 20:31',
   parts:[['성경','2'],['성경','0'],['현장','3'],['패드','1']]},
  {name:'출항 명령서', room:'선장실', code:'0822', verse:'눅 8:22',
   parts:[['교사','0'],['패드','8'],['현장','2'],['현장','2']]},
  {name:'사슬 자물쇠', room:'화물칸', code:'0829', verse:'눅 8:29',
   parts:[['패드','0'],['패드','8'],['교사','2'],['현장','9']]},
  {name:'선원 명부 궤',room:'선원실', code:'0854', verse:'눅 8:54',
   parts:[['패드','0'],['패드','8'],['현장','5'],['성경','4']]},
  {name:'등대 철문',  room:'등대',   code:'0901', verse:'눅 9:1',
   parts:[['패드','0'],['패드','9'],['교사','0'],['현장','1']]},
];
const TEAM_LOCKS=[
  {name:'조타실 항해궤', codes:['8624','5137','7412']},
  {name:'비밀선창 보물궤',codes:['3327','6085','2914']},
];
const TEAMS=['베드로호','야고보호','요한호'];
const ACT_NAMES=['부두','출항','폭풍','무덤 섬','돌아온 항구','등대'];
const PZ_ORDER=['p1','p2','p3','p4','p5','p6','p7','p8','p9','p10','p11','p12','p13'];
const PZ_TITLE={p1:'보이지 않는 잉크',p2:'도둑이 남긴 쪽지',p3:'항해사의 해도',p4:'폭풍 속 무전',
  p5:'물에 젖은 항해일지',p6:'이천의 비밀',p7:'네 개의 다이얼',p8:'거꾸로 쓰인 편지',
  p9:'군중 속의 손',p10:'레핀의 방',p11:'소녀를 깨운 말',p12:'파송의 신호기',p13:'등대 점화'};

let TAB='live', S=null;
function load(){ try{ const r=localStorage.getItem(LS_KEY); S=r?JSON.parse(r):null; }catch(e){ S=null; } }
function fmt(ms){ const t=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function elapsed(){ if(!S||!S.startTs) return 0; return (S.finishTs||Date.now())-S.startTs+(S.penaltyMin||0)*60000; }
function solvedN(){ return S&&S.solved?Object.keys(S.solved).length:0; }

const TABS=[['live','현황'],['manual','📖 안내서'],['guide','관문 해설'],['codes','미션표'],['prep','준비물'],['games','미니게임']];

function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>
    `<button class="${TAB===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
  document.getElementById('view').innerHTML=({live:vLive,manual:vManual,guide:vGuide,codes:vCodes,prep:vPrep,games:vGames})[TAB]();
  const pt=document.getElementById('printTitle');
  if(pt){ const nm=(TABS.find(t=>t[0]===TAB)||[,''])[1].replace(/^[^가-힣A-Za-z]+/,'');
    pt.textContent='믿음의 항해 — '+nm+(TAB==='live'?'':' · 선생님용'); }
}
// 접힌 해설 토글은 CSS로는 인쇄에 안 나온다 — 인쇄 직전에 실제로 펼치고 끝나면 되돌린다
let _wasOpen=null;
window.addEventListener('beforeprint',()=>{
  const d=[...document.querySelectorAll('details')];
  _wasOpen=d.map(x=>x.open); d.forEach(x=>x.open=true);
});
window.addEventListener('afterprint',()=>{
  if(!_wasOpen) return;
  [...document.querySelectorAll('details')].forEach((x,i)=>{ x.open=!!_wasOpen[i]; });
  _wasOpen=null;
});
function go(t){ TAB=t; if(t==='live') fetchTeams().then(render); else render(); }
function refresh(){ fetchTeams().then(render); }

function agoTxt(t){
  if(!t) return '-';
  const d=Math.floor((Date.now()-new Date(t))/1000);
  if(d<20) return '방금'; if(d<60) return d+'초 전';
  if(d<3600) return Math.floor(d/60)+'분 전';
  return Math.floor(d/3600)+'시간 전';
}
function stale(t){ return !t || (Date.now()-new Date(t))>120000; }

function vLive(){
  const shipMap={anchor:'닻',sail:'돛',helm:'침로',trim:'하중'};
  let h=`<div class="card" style="padding:13px 16px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="k" style="margin:0">전 팀 현황</span>
      <span class="grow"></span>
      <span class="note" style="font-size:13px">${SYNCERR?('<span style="color:#D98A7A">'+SYNCERR+'</span>'):('마지막 갱신 '+(SYNCED?SYNCED.toLocaleTimeString('ko-KR'):'-'))}</span>
      <button onclick="refresh()" style="font-family:inherit;font-size:13px;color:#241C06;background:var(--brass);border:0;border-radius:8px;padding:7px 14px;cursor:pointer">새로고침</button>
    </div></div>`;

  if(SYNCERR && !ROWS.length){
    h+=`<div class="warn">서버에서 팀 현황을 못 읽었습니다.<br>
      <b>escape-progress-setup.sql</b>을 Supabase에 실행했는지 확인하세요.
      아직 실행 전이면 아래 <b>이 기기</b> 현황만 보입니다.</div>`;
  }
  if(!ROWS.length && !SYNCERR){
    h+=`<div class="card"><p class="note">아직 올라온 팀이 없습니다.
      팀 패드에서 게임을 시작하면 15초 안에 여기 나타납니다.</p></div>`;
  }

  // 팀 카드 — 한눈에 비교
  if(ROWS.length){
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:12px">`;
    ROWS.forEach((r,idx)=>{
      const pct=Math.round((r.solved||0)/13*100);
      const st=stale(r.updated_at);
      const rank=r.finished?'🏁':(idx===0?'1위':(idx+1)+'위');
      h+=`<div class="card" style="margin:0;${st?'opacity:.55':''}">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:19px">${r.team_name}</span>
          <span class="pill ${r.finished?'on':''}">${rank}</span>
          <span class="grow"></span>
          <span class="note" style="font-size:12px">${st?'⚠ ':''}${agoTxt(r.updated_at)}</span>
        </div>
        <div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px">
          <div class="stat" style="padding:9px"><span>경과</span><b style="font-size:19px">${fmt(r.elapsed_ms||0)}</b></div>
          <div class="stat" style="padding:9px"><span>진행</span><b style="font-size:19px">${r.solved||0}<i>/13</i></b></div>
          <div class="stat" style="padding:9px"><span>막</span><b style="font-size:19px">${r.act||0}</b></div>
          <div class="stat" style="padding:9px"><span>벌점</span><b style="font-size:19px">${r.penalty_min||0}<i>분</i></b></div>
        </div>
        <table style="margin-top:10px">
          <tr><th style="width:78px">위치</th><td>${ACT_NAMES[r.act]||'-'}</td></tr>
          <tr><th>배 조작</th><td>${Object.keys(shipMap).map(k=>
              `<span class="pill ${(r.ship||[]).includes(k)?'ok':''}">${shipMap[k]}</span>`).join(' ')}</td></tr>
          <tr><th>힌트·정답</th><td>${r.hints||0} · <b>${r.reveals||0}</b></td></tr>
          <tr><th>자물쇠</th><td>${(r.locks||[]).length}개 / 도구 ${(r.items||[]).length}개</td></tr>
          <tr><th>최근</th><td class="note" >${r.last_event||'-'}</td></tr>
        </table>
      </div>`;
    });
    h+=`</div>`;

    // 관문별 진행 비교표
    h+=`<div class="card"><div class="k">관문별 진행 비교</div>

// 아주 단순한 마크다운 변환 (안내서 전용)
function mdToHtml(md){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=md.split('\n'); let out=[], inTable=false, inCode=false, inList=false;
  const inline=t=>esc(t)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const closeList=()=>{ if(inList){ out.push('</ul>'); inList=false; } };
  const closeTable=()=>{ if(inTable){ out.push('</table>'); inTable=false; } };
  for(let raw of lines){
    const l=raw.replace(/\r/g,'');
    if(/^```/.test(l)){ if(inCode){ out.push('</pre>'); inCode=false; } else { closeList(); closeTable(); out.push('<pre>'); inCode=true; } continue; }
    if(inCode){ out.push(esc(l)); continue; }
    if(/^\s*$/.test(l)){ closeList(); closeTable(); continue; }
    if(/^<a name=/.test(l)) continue;
    if(/^\|/.test(l)){
      const cells=l.split('|').slice(1,-1).map(c=>c.trim());
      if(cells.every(c=>/^:?-+:?$/.test(c))) continue;
      if(!inTable){ closeList(); out.push('<table>'); inTable=true;
        out.push('<tr>'+cells.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'); continue; }
      out.push('<tr>'+cells.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>'); continue;
    }
    closeTable();
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ closeList(); const lv=m[1].length; out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if(/^>\s?/.test(l)){ closeList(); out.push(`<blockquote>${inline(l.replace(/^>\s?/,''))}</blockquote>`); continue; }
    if(/^---+$/.test(l)){ closeList(); out.push('<hr>'); continue; }
    if((m=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/))){ if(!inList){ out.push('<ul>'); inList=true; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    closeList(); out.push(`<p>${inline(l)}</p>`);
  }
  closeList(); closeTable(); if(inCode) out.push('</pre>');
  return out.join('\n');
}
