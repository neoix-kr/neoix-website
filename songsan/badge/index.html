<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>믿음의 항해 명찰 (100×67mm) — 송산제일교회 2026 교육부서 연합수련회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e5799;
  --navy-dk:#17436f;
  --blue:#2f6db4;
  --pink:#d94f8e;
  --ink:#3f2a1a;
  --parch:#f7eed8;
  --parch-line:#d8c69a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e9eef5;font-family:'Noto Sans KR',sans-serif;color:#233}

/* ── 화면용 조작 바 ───────────────────────── */
.toolbar{
  position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dde4ee;
  padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.toolbar h1{font-size:16px;font-weight:900;white-space:nowrap}
.toolbar h1 small{font-weight:500;color:#7a8598;font-size:13px;margin-left:6px}
.toolbar .grow{flex:1}
.toolbar button{
  border:0;background:var(--navy);color:#fff;font-weight:700;
  font-size:14px;padding:11px 22px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.toolbar button.ghost{background:#eef2f8;color:#33445c}
.toolbar button:hover{filter:brightness(1.06)}

.panel{max-width:1180px;margin:0 auto;padding:22px 20px 4px}
.panel h2{font-size:14px;font-weight:900;color:#33445c;margin-bottom:8px}
.panel .hint{font-size:12.5px;color:#6b7688;line-height:1.7;margin-bottom:10px}
.panel .hint b{color:#c33}
.panel textarea{
  width:100%;min-height:132px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13.5px;line-height:1.85;padding:13px 15px;border:1px solid #cfd8e6;
  border-radius:10px;background:#fff;color:#233;resize:vertical;
}
.panel textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,87,153,.13)}
.count{font-size:12.5px;color:#6b7688;margin-top:7px}
.count b{color:var(--navy);font-weight:900}

.backedit{max-width:1180px;margin:14px auto 0;padding:0 20px}
.backedit .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.backedit label{display:block;font-size:12px;font-weight:700;color:#6b7688;margin-bottom:4px}
.backedit input{width:100%;font-family:inherit;font-size:14px;padding:9px 12px;
  border:1px solid #cfd8e6;border-radius:8px;background:#fff;color:#233}
.backedit input:focus{outline:none;border-color:var(--navy)}

.previewbar{max-width:1180px;margin:26px auto 0;padding:0 20px;
  display:flex;align-items:center;gap:10px}
.previewbar h2{font-size:14px;font-weight:900;color:#33445c}
.previewbar span{font-size:12.5px;color:#6b7688}

/* ── 명찰 카드 (100 × 67 mm 가로) ─────────── */
.badge{
  width:100mm;height:67mm;position:relative;overflow:hidden;background:var(--parch);
  border-radius:2.6mm;box-shadow:0 5px 20px rgba(20,40,80,.16);
  background-image:url('parch.webp');background-size:cover;background-position:center;
}

/* 앞면 */
.front .boat{
  position:absolute;right:-4mm;bottom:5.2mm;width:38mm;opacity:.22;
  pointer-events:none;user-select:none;
}
.front .sea{
  position:absolute;left:0;right:0;bottom:6.6mm;height:7mm;width:100%;
  object-fit:cover;opacity:.34;pointer-events:none;
}
.front .top{
  position:absolute;left:5mm;right:5mm;top:4mm;height:20mm;
  display:flex;align-items:center;gap:3.4mm;
}
.front .plaque{height:20mm;width:auto;flex:0 0 auto}
.chips{display:flex;flex-direction:column;gap:1.8mm;align-items:flex-start}
.chip{
  font-family:'Jua',sans-serif;color:#fff;font-size:5.2mm;line-height:1;
  padding:1.9mm 4mm 2.3mm;border-radius:99px;letter-spacing:.2mm;white-space:nowrap;
  box-shadow:0 .7mm 0 rgba(0,0,0,.13);
}
.chip.team{background:var(--blue)}
.chip.grade{background:var(--pink)}
.front .name{
  position:absolute;left:4mm;right:4mm;top:25.5mm;height:27mm;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.front .name span{
  font-family:'Jua',sans-serif;font-size:17mm;color:var(--ink);line-height:1.05;
  letter-spacing:1.2mm;text-align:center;white-space:nowrap;
  text-shadow:0 .6mm 0 rgba(255,255,255,.7);
}
.front .footer{
  position:absolute;left:0;right:0;bottom:0;height:6.6mm;
  background:var(--navy);display:flex;align-items:center;justify-content:center;
}
.front .footer span{
  color:#fff;font-size:3.1mm;font-weight:700;letter-spacing:.1mm;white-space:nowrap;
}

/* 뒷면 */
.back{
  background:linear-gradient(158deg,#faf3e2 0%,#f4e8ca 62%,#eddeba 100%);
  border:1mm solid var(--navy);display:flex;flex-direction:column;
  padding:0;background-image:none;
}
.back .b-top{
  background:var(--navy);color:#fff;text-align:center;padding:1.3mm 2mm 1.5mm;flex:0 0 auto;
}
.back .b-top .t1{font-family:'Jua',sans-serif;font-size:4.1mm;letter-spacing:.4mm;line-height:1}
.back .b-top .t2{font-size:2.3mm;opacity:.9;margin-top:.5mm;font-weight:500}
.back .b-body{flex:1;padding:1.6mm 3.6mm 1.6mm;display:flex;flex-direction:column;gap:1.1mm;min-height:0;overflow:hidden}
.b-sec{background:rgba(255,255,255,.7);border:.35mm solid var(--parch-line);
  border-radius:1.8mm;padding:1.2mm 2.6mm}
.b-sec h3{font-size:2.7mm;color:var(--pink);font-weight:900;letter-spacing:.15mm;
  display:flex;align-items:center;gap:1.3mm;margin-bottom:.8mm}
.b-sec h3::after{content:"";flex:1;height:.3mm;background:var(--parch-line)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:.05mm 0}
.row .k{color:#7a6a4c;font-weight:700;font-size:2.8mm;flex-shrink:0;margin-right:3mm}
.row .v{color:var(--ink);font-weight:700;font-size:3.1mm;text-align:right;line-height:1.3}
.b-line{font-size:2.9mm;color:var(--ink);font-weight:700;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-line em{font-style:normal;color:#7a6a4c;font-weight:700;font-size:2.7mm;margin-right:2mm}
.back .b-foot{
  flex:0 0 auto;background:var(--navy-dk);color:#fff;text-align:center;padding:1.1mm 2mm 1.3mm;
}
.back .b-foot .l1{font-size:2.7mm;font-weight:700;letter-spacing:.1mm}
.back .b-foot .l2{font-size:2.2mm;opacity:.85;margin-top:.3mm}

/* ── 화면 미리보기 배치 ───────────────────── */
.preview{max-width:1180px;margin:12px auto 40px;padding:0 20px;
  display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.pv-item .lab{text-align:center;font-size:12.5px;font-weight:700;color:#889;margin-bottom:9px}

/* ── 인쇄: A4 세로 1장에 8개(2열×4행) ────── */
.sheets{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  .toolbar,.panel,.backedit,.previewbar,.preview{display:none !important}
  .sheets{display:block}
  .sheet{
    width:210mm;height:297mm;padding:14.5mm 5mm;
    display:grid;grid-template-columns:100mm 100mm;grid-template-rows:repeat(4,67mm);
    justify-content:center;align-content:start;gap:0;
    page-break-after:always;break-after:page;
  }
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet .badge{box-shadow:none;border-radius:0;outline:.2mm dashed #c7cdd6;outline-offset:-.1mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>

<div class="toolbar">
  <h1>⚓ 믿음의 항해 명찰 <small>100 × 67 mm 가로 · A4 한 장에 8개</small></h1>
  <span class="grow"></span>
  <button class="ghost" onclick="fillSample()">예시 명단 넣기</button>
  <button onclick="window.print()">🖨 인쇄 / PDF 저장</button>
</div>

<div class="panel">
  <h2>명단</h2>
  <p class="hint">
    <b>한 줄에 한 사람</b> — <code>이름, 조, 학년</code> 순서로 쉼표(,)나 탭으로 구분해 넣으세요. 엑셀에서 복사해 붙여 넣어도 됩니다.<br>
    조·학년은 비워도 됩니다. 예) <code>박정겸, 3조, 중2</code> · <code>김하은,1조,고1</code>
  </p>
  <textarea id="roster" spellcheck="false" oninput="render()"></textarea>
  <p class="count">명찰 <b id="cnt">0</b>장 · A4 앞면 <b id="pg">0</b>장 + 뒷면 <b id="pgb">0</b>장</p>
</div>

<div class="backedit">
  <h2 style="font-size:14px;font-weight:900;color:#33445c;margin-bottom:8px">뒷면 정보 <span style="font-weight:500;color:#7a8598;font-size:12.5px">— 모든 명찰 뒷면에 똑같이 들어갑니다</span></h2>
  <div class="grid">
    <div><label>교회 사무실</label><input id="f_office" value="000-0000-0000" oninput="render()"></div>
    <div><label>담당 교역자</label><input id="f_pastor" value="010-0000-0000" oninput="render()"></div>
    <div><label>인솔 교사</label><input id="f_teacher" value="010-0000-0000" oninput="render()"></div>
    <div><label>교회 주소</label><input id="f_addr" value="교회 주소를 입력하세요" oninput="render()"></div>
    <div><label>수련회 장소</label><input id="f_place" value="미산제일침례교회 (충남 보령)" oninput="render()"></div>
    <div><label>수련회 기간</label><input id="f_date" value="2026. 8. 6(목) ~ 8. 8(토)" oninput="render()"></div>
  </div>
</div>

<div class="previewbar">
  <h2>미리보기</h2>
  <span>첫 번째 사람의 앞면과, 모두 공통인 뒷면입니다</span>
</div>
<div class="preview" id="preview"></div>

<div class="sheets" id="sheets"></div>

<script>
const SAMPLE = `박정겸, 3조, 중2
김하은, 1조, 고1
이서준, 2조, 중3
정민지, 1조, 중1
최도윤, 4조, 고2
한예린, 3조, 중2
오지호, 2조, 고1
서수아, 4조, 중3`;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseRoster(){
  return document.getElementById('roster').value
    .split('\n').map(l=>l.trim()).filter(Boolean)
    .map(line=>{
      const p=line.split(/[,\t]/).map(x=>x.trim());
      return { name:p[0]||'', team:p[1]||'', grade:p[2]||'' };
    })
    .filter(x=>x.name);
}

function frontHtml(p){
  const chips =
    (p.team  ? `<span class="chip team">${esc(p.team)}</span>` : '') +
    (p.grade ? `<span class="chip grade">${esc(p.grade)}</span>` : '');
  return `<div class="badge front">
    <img class="sea" src="waves.webp" alt="">
    <img class="boat" src="boat.webp" alt="">
    <div class="top">
      <img class="plaque" src="logo.webp" alt="믿음의 항해">
      <div class="chips">${chips}</div>
    </div>
    <div class="name"><span>${esc(p.name)}</span></div>
    <div class="footer"><span>송산제일교회 2026 교육부서 연합수련회</span></div>
  </div>`;
}

function backHtml(){
  const v=id=>esc(document.getElementById(id).value);
  return `<div class="badge back">
    <div class="b-top">
      <div class="t1">⚓ 비상 연락처</div>
      <div class="t2">예수님과 함께하는 믿음의 항해 · 히브리서 12:2</div>
    </div>
    <div class="b-body">
      <div class="b-sec">
        <h3>📞 연락처</h3>
        <div class="row"><span class="k">교회 사무실</span><span class="v">${v('f_office')}</span></div>
        <div class="row"><span class="k">담당 교역자</span><span class="v">${v('f_pastor')}</span></div>
        <div class="row"><span class="k">인솔 교사</span><span class="v">${v('f_teacher')}</span></div>
      </div>
      <div class="b-sec">
        <h3>🧭 장소</h3>
        <div class="b-line"><em>교회</em>${v('f_addr')}</div>
        <div class="b-line" style="margin-top:.8mm"><em>수련회</em>${v('f_place')} · ${v('f_date')}</div>
      </div>
    </div>
    <div class="b-foot">
      <div class="l1">송산제일교회 2026 교육부서 연합수련회</div>
      <div class="l2">이 명찰을 습득하시면 위 연락처로 연락 부탁드립니다</div>
    </div>
  </div>`;
}

const PER_PAGE = 8;

function render(){
  const list=parseRoster();
  document.getElementById('cnt').textContent=list.length;
  const pages=Math.ceil(list.length/PER_PAGE)||0;
  document.getElementById('pg').textContent=pages;
  document.getElementById('pgb').textContent=pages;

  // 미리보기 — 첫 사람 앞면 + 공통 뒷면
  const first = list[0] || {name:'이름', team:'0조', grade:'학년'};
  document.getElementById('preview').innerHTML =
    `<div class="pv-item"><div class="lab">앞면 (사람마다 다름)</div>${frontHtml(first)}</div>`+
    `<div class="pv-item"><div class="lab">뒷면 (전원 공통)</div>${backHtml()}</div>`;

  // 인쇄용 — 앞면 페이지들을 먼저, 그 뒤에 같은 수의 뒷면 페이지
  let html='';
  for(let i=0;i<pages;i++){
    const slice=list.slice(i*PER_PAGE,(i+1)*PER_PAGE);
    html+=`<div class="sheet">${slice.map(frontHtml).join('')}</div>`;
  }
  const back=backHtml();
  for(let i=0;i<pages;i++){
    const n=Math.min(PER_PAGE, list.length-i*PER_PAGE);
    html+=`<div class="sheet">${back.repeat(n)}</div>`;
  }
  document.getElementById('sheets').innerHTML=html;
  fitNames();
  fitBacks();
}

/* 주소·장소가 길어도 아래 띠를 밀지 않게, 넘치면 글자를 줄인다 */
function fitBacks(){
  document.querySelectorAll('.badge.back').forEach(b=>{
    const body=b.querySelector('.b-body'); if(!body) return;
    const lines=body.querySelectorAll('.b-line');
    let size=2.9, guard=0;
    lines.forEach(l=>l.style.fontSize=size+'mm');
    while(body.scrollHeight>body.clientHeight+1 && size>2.1 && guard++<20){
      size-=0.1;
      lines.forEach(l=>l.style.fontSize=size+'mm');
    }
  });
}

/* 이름이 칸을 넘으면 넘지 않을 때까지 글자를 줄인다 — 성이 두 자여도 안 잘린다 */
function fitNames(){
  document.querySelectorAll('.front .name').forEach(box=>{
    const sp=box.firstElementChild; if(!sp) return;
    let size=17;                       // mm
    sp.style.fontSize=size+'mm';
    sp.style.letterSpacing='1.2mm';
    let guard=0;
    while(sp.scrollWidth>box.clientWidth && size>7 && guard++<40){
      size-=0.6;
      sp.style.fontSize=size+'mm';
      if(size<13) sp.style.letterSpacing='.4mm';
    }
  });
}

function fillSample(){ document.getElementById('roster').value=SAMPLE; render(); }

fillSample();
</script>

</body>
</html>
