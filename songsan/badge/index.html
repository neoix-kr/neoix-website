<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>믿음의 항해 명찰 (100×67mm) — 송산제일교회 2026 교육부서 연합수련회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#123B5B;
  --navy-dk:#0F2E45;
  --red:#E1533D;
  --line:#DDE4EA;
  --mute:#8A99A8;
  --wash:#F1F5F8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e9eef5;font-family:'Noto Sans KR',sans-serif;color:#233}

/* ── 조작 바 ───────────────────────────── */
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dde4ee;
  padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.toolbar h1{font-size:16px;font-weight:900;white-space:nowrap}
.toolbar h1 small{font-weight:500;color:#7a8598;font-size:13px;margin-left:6px}
.toolbar .grow{flex:1}
.toolbar button{border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;
  padding:11px 22px;border-radius:10px;cursor:pointer;font-family:inherit}
.toolbar button.ghost{background:#eef2f8;color:#33445c}
.toolbar button:hover{filter:brightness(1.08)}

.panel{max-width:1180px;margin:0 auto;padding:22px 20px 4px}
.panel h2{font-size:14px;font-weight:900;color:#33445c;margin-bottom:8px}
.panel .hint{font-size:12.5px;color:#6b7688;line-height:1.7;margin-bottom:10px}
.panel .hint b{color:#c33}
.panel textarea{width:100%;min-height:132px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13.5px;line-height:1.85;padding:13px 15px;border:1px solid #cfd8e6;border-radius:10px;
  background:#fff;color:#233;resize:vertical}
.panel textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,59,91,.13)}
.count{font-size:12.5px;color:#6b7688;margin-top:7px}
.count b{color:var(--navy);font-weight:900}

.backedit{max-width:1180px;margin:14px auto 0;padding:0 20px}
.backedit .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.backedit label{display:block;font-size:12px;font-weight:700;color:#6b7688;margin-bottom:4px}
.backedit input{width:100%;font-family:inherit;font-size:14px;padding:9px 12px;
  border:1px solid #cfd8e6;border-radius:8px;background:#fff;color:#233}
.backedit input:focus{outline:none;border-color:var(--navy)}

.previewbar{max-width:1180px;margin:26px auto 0;padding:0 20px;display:flex;align-items:center;gap:10px}
.previewbar h2{font-size:14px;font-weight:900;color:#33445c}
.previewbar span{font-size:12.5px;color:#6b7688}

/* ── 명찰 100 × 67 mm 「승선권」 ─────────── */
.badge{width:100mm;height:67mm;position:relative;overflow:hidden;background:#fff;
  border-radius:2.4mm;box-shadow:0 5px 20px rgba(20,40,80,.16);font-family:'Noto Sans KR',sans-serif}

/* 앞면 */
.front .stub{position:absolute;left:0;top:0;bottom:0;width:26mm;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm}
.front .stub .mark{width:10.5mm;height:10.5mm;object-fit:contain;opacity:.92;margin-bottom:.8mm}
.front .stub .lbl{font-size:2mm;letter-spacing:1.2mm;color:#7FA8C6;text-indent:1.2mm}
.front .stub .big{font-family:'Black Han Sans',sans-serif;font-size:9mm;line-height:1;letter-spacing:.2mm}
.front .stub .gr{font-family:'Do Hyeon',sans-serif;font-size:4mm;background:var(--red);
  border-radius:99px;padding:.9mm 3mm 1.1mm;white-space:nowrap}
.front .perf{position:absolute;left:26mm;top:0;bottom:0;border-left:.4mm dashed #7FA8C6;opacity:.55}
.front .main{position:absolute;left:26mm;right:0;top:0;bottom:0;padding:5mm 5mm 0}
.front .hdr{display:flex;justify-content:space-between;align-items:flex-start}
.front .hdr .t{font-family:'Do Hyeon',sans-serif;font-size:3.8mm;color:var(--navy);letter-spacing:.4mm}
.front .hdr .t small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:2.1mm;
  color:var(--mute);letter-spacing:1mm;margin-top:.4mm;font-weight:500}
.front .hdr .no{font-size:2.1mm;color:#A9B6C2;letter-spacing:.5mm;text-align:right;line-height:1.6}
.front .nm{position:absolute;left:5mm;right:5mm;top:15.5mm;height:23mm;display:flex;
  align-items:center;overflow:hidden}
.front .nm span{font-family:'Black Han Sans',sans-serif;font-size:15mm;color:var(--navy-dk);
  letter-spacing:.8mm;line-height:1;white-space:nowrap}
.front .boat{position:absolute;right:2.5mm;bottom:9.4mm;width:24mm;pointer-events:none}
.front .tag{position:absolute;left:5mm;bottom:13.4mm;display:flex;gap:1.4mm;max-width:40mm}
.front .tag span{font-size:2.2mm;letter-spacing:.4mm;color:#7B8A99;border:.25mm solid var(--line);
  border-radius:99px;padding:.7mm 2.2mm;white-space:nowrap}
.front .line{position:absolute;left:5mm;right:5mm;bottom:9mm;height:.3mm;background:var(--line)}
.front .meta{position:absolute;left:5mm;right:5mm;bottom:3.4mm;display:flex;
  justify-content:space-between;font-size:2.3mm;color:#6B7B8A}
.front .meta b{color:var(--navy)}

/* 뒷면 */
.back .top{height:10mm;background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 5mm}
.back .top .t{font-family:'Do Hyeon',sans-serif;font-size:3.8mm;letter-spacing:.6mm}
.back .top .s{font-size:2.1mm;color:#9CBBD3;letter-spacing:.4mm}
.back .tb{position:absolute;left:5mm;right:5mm;top:13.4mm;bottom:9.6mm;overflow:hidden}
.back .r{display:flex;align-items:baseline;padding:1.5mm 0;border-bottom:.3mm solid #E6EBF0}
.back .r:last-child{border-bottom:0}
.back .k{width:22mm;flex:0 0 auto;font-size:2.5mm;color:var(--mute);letter-spacing:.2mm}
.back .v{font-size:3.1mm;font-weight:700;color:var(--navy);line-height:1.35}
.back .fo{position:absolute;left:0;right:0;bottom:0;height:9.6mm;background:var(--wash);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3mm;
  border-top:.3mm solid var(--line)}
.back .fo .a{font-size:2.5mm;font-weight:700;color:var(--navy)}
.back .fo .b{font-size:2.1mm;color:#7B8A99}

/* ── 화면 미리보기 ────────────────────────── */
.preview{max-width:1180px;margin:12px auto 40px;padding:0 20px;display:flex;gap:26px;
  flex-wrap:wrap;align-items:flex-start}
.pv-item .lab{text-align:center;font-size:12.5px;font-weight:700;color:#889;margin-bottom:9px}

/* ── 인쇄: A4 한 장에 8개 ─────────────────── */
.sheets{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  .toolbar,.panel,.backedit,.previewbar,.preview{display:none !important}
  .sheets{display:block}
  .sheet{width:210mm;height:297mm;padding:14.5mm 5mm;
    display:grid;grid-template-columns:100mm 100mm;grid-template-rows:repeat(4,67mm);
    justify-content:center;align-content:start;gap:0;
    page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet .badge{box-shadow:none;border-radius:0;outline:.2mm dashed #c7cdd6;outline-offset:-.1mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>

<div class="toolbar">
  <h1>⚓ 믿음의 항해 명찰 <small>승선권 · 100 × 67 mm · A4 한 장에 8개</small></h1>
  <span class="grow"></span>
  <button class="ghost" onclick="fillSample()">예시 명단 넣기</button>
  <button onclick="window.print()">🖨 인쇄 / PDF 저장</button>
</div>

<div class="panel">
  <h2>명단</h2>
  <p class="hint">
    <b>한 줄에 한 사람</b> — <code>이름, 조, 학년</code> 순서로 쉼표(,)나 탭으로 구분해 넣으세요. 엑셀에서 복사해 붙여 넣어도 됩니다.<br>
    조·학년은 비워도 됩니다. 예) <code>박정겸, 3조, 중2</code> · <code>김하은,1조,고1</code>
  </p>
  <textarea id="roster" spellcheck="false" oninput="render()"></textarea>
  <p class="count">명찰 <b id="cnt">0</b>장 · A4 앞면 <b id="pg">0</b>장 + 뒷면 <b id="pgb">0</b>장</p>
</div>

<div class="backedit">
  <h2 style="font-size:14px;font-weight:900;color:#33445c;margin-bottom:8px">공통 정보 <span style="font-weight:500;color:#7a8598;font-size:12.5px">— 앞면 아래와 뒷면에 똑같이 들어갑니다</span></h2>
  <div class="grid">
    <div><label>교회 사무실</label><input id="f_office" value="000-0000-0000" oninput="render()"></div>
    <div><label>담당 교역자</label><input id="f_pastor" value="010-0000-0000" oninput="render()"></div>
    <div><label>인솔 교사</label><input id="f_teacher" value="010-0000-0000" oninput="render()"></div>
    <div><label>수련회 장소</label><input id="f_place" value="미산제일침례교회 · 충남 보령" oninput="render()"></div>
    <div><label>기간</label><input id="f_date" value="2026. 8. 6(목) ~ 8. 8(토)" oninput="render()"></div>
    <div><label>기간 요약 (앞면 태그)</label><input id="f_short" value="2026. 8. 6 ~ 8. 8" oninput="render()"></div>
  </div>
</div>

<div class="previewbar">
  <h2>미리보기</h2>
  <span>첫 번째 사람의 앞면과, 모두 공통인 뒷면입니다</span>
</div>
<div class="preview" id="preview"></div>

<div class="sheets" id="sheets"></div>

<script>
const SAMPLE = `박정겸, 3조, 중2
김하은, 1조, 고1
이서준, 2조, 중3
정민지, 1조, 중1
최도윤, 4조, 고2
한예린, 3조, 중2
오지호, 2조, 고1
서수아, 4조, 중3`;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v = id => esc(document.getElementById(id).value);

function parseRoster(){
  return document.getElementById('roster').value
    .split('\n').map(l=>l.trim()).filter(Boolean)
    .map(line=>{ const p=line.split(/[,\t]/).map(x=>x.trim());
      return { name:p[0]||'', team:p[1]||'', grade:p[2]||'' }; })
    .filter(x=>x.name);
}

function frontHtml(p){
  const num = (p.team.match(/\d+/) || [p.team.replace(/조/g,'')])[0] || '–';
  return `<div class="badge front">
    <div class="stub">
      <img class="mark" src="boat-mark.png" alt="" onerror="this.remove()">
      <span class="lbl">TEAM</span>
      <span class="big">${esc(num)}</span>
      ${p.grade?`<span class="gr">${esc(p.grade)}</span>`:''}
    </div>
    <div class="perf"></div>
    <div class="main">
      <div class="hdr">
        <div class="t">믿음의 항해<small>BOARDING PASS</small></div>
        <div class="no">송산제일교회<br>2026 연합수련회</div>
      </div>
      <div class="nm"><span>${esc(p.name)}</span></div>
      <img class="boat" src="boat-cutout.png" alt="" onerror="this.remove()">
      <div class="tag"><span>${v('f_short')}</span><span>2박 3일</span></div>
      <div class="line"></div>
      <div class="meta"><span>${v('f_place')}</span><span><b>히브리서 12:2</b></span></div>
    </div>
  </div>`;
}

function backHtml(){
  return `<div class="badge back">
    <div class="top"><span class="t">비상 연락처</span><span class="s">EMERGENCY CONTACT</span></div>
    <div class="tb">
      <div class="r"><span class="k">교회 사무실</span><span class="v">${v('f_office')}</span></div>
      <div class="r"><span class="k">담당 교역자</span><span class="v">${v('f_pastor')}</span></div>
      <div class="r"><span class="k">인솔 교사</span><span class="v">${v('f_teacher')}</span></div>
      <div class="r"><span class="k">수련회 장소</span><span class="v">${v('f_place')}</span></div>
      <div class="r"><span class="k">기간</span><span class="v">${v('f_date')}</span></div>
    </div>
    <div class="fo">
      <span class="a">송산제일교회 2026 교육부서 연합수련회</span>
      <span class="b">이 명찰을 습득하시면 위 연락처로 연락 부탁드립니다</span>
    </div>
  </div>`;
}

const PER_PAGE = 8;

function render(){
  const list = parseRoster();
  document.getElementById('cnt').textContent = list.length;
  const pages = Math.ceil(list.length/PER_PAGE) || 0;
  document.getElementById('pg').textContent = pages;
  document.getElementById('pgb').textContent = pages;

  const first = list[0] || { name:'이름', team:'0조', grade:'학년' };
  document.getElementById('preview').innerHTML =
    `<div class="pv-item"><div class="lab">앞면 (사람마다 다름)</div>${frontHtml(first)}</div>` +
    `<div class="pv-item"><div class="lab">뒷면 (전원 공통)</div>${backHtml()}</div>`;

  let html = '';
  for (let i=0; i<pages; i++){
    html += `<div class="sheet">${list.slice(i*PER_PAGE,(i+1)*PER_PAGE).map(frontHtml).join('')}</div>`;
  }
  const back = backHtml();
  for (let i=0; i<pages; i++){
    html += `<div class="sheet">${back.repeat(Math.min(PER_PAGE, list.length - i*PER_PAGE))}</div>`;
  }
  document.getElementById('sheets').innerHTML = html;

  fitNames();
  fitBacks();
}

/* 이름이 칸을 넘으면 넘지 않을 때까지 글자를 줄인다 */
function fitNames(){
  document.querySelectorAll('.front .nm').forEach(box=>{
    const sp = box.firstElementChild; if(!sp) return;
    let size = 15;
    sp.style.fontSize = size+'mm';
    sp.style.letterSpacing = '.8mm';
    let guard = 0;
    while (sp.scrollWidth > box.clientWidth && size > 6 && guard++ < 40){
      size -= 0.5;
      sp.style.fontSize = size+'mm';
      if (size < 11) sp.style.letterSpacing = '.2mm';
    }
  });
}

/* 주소가 길어도 아래 띠를 밀지 않게 글자를 줄인다 */
function fitBacks(){
  document.querySelectorAll('.badge.back').forEach(b=>{
    const tb = b.querySelector('.tb'); if(!tb) return;
    const vs = tb.querySelectorAll('.v');
    let size = 3.1, guard = 0;
    vs.forEach(x=>x.style.fontSize = size+'mm');
    while (tb.scrollHeight > tb.clientHeight + 1 && size > 2.2 && guard++ < 20){
      size -= 0.1;
      vs.forEach(x=>x.style.fontSize = size+'mm');
    }
  });
}

function fillSample(){ document.getElementById('roster').value = SAMPLE; render(); }
fillSample();
</script>

</body>
</html>
